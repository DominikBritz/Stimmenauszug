appId: de.britz.stimmenauszug
productName: Stimmenauszug
copyright: Copyright © 2026 Dominik Britz
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  language: 1031
npmRebuild: false
