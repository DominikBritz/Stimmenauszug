name: Release

# Läuft nur bei einem Versions-Tag (z.B. v0.1.0): Tests, Build für macOS (arm64) und
# Windows (x64) auf einem macOS-Runner, dann ein GitHub-Release mit den Installern.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z.B. 0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: |
          npm ci
          # Falls Install-Skripte blockiert wurden: Electron-Binary nachladen
          [ -d node_modules/electron/dist ] || node node_modules/electron/install.js

      - name: Version aus Tag übernehmen
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Installer erzeugen (macOS + Windows)
        run: npx electron-builder --mac --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Stimmenauszug ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Unsignierte Builds. Hinweise zum ersten Start: [docs/INSTALLATION.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALLATION.md)

            | Plattform | Datei |
            |---|---|
            | macOS (Apple Silicon) | `Stimmenauszug-${{ steps.version.outputs.version }}-arm64.dmg` |
            | Windows Installer | `Stimmenauszug Setup ${{ steps.version.outputs.version }}.exe` |
            | Windows portabel | `Stimmenauszug ${{ steps.version.outputs.version }}.exe` |
          files: |
            dist/*.dmg
            dist/*.exe
